name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: licence headers
        run: bun run spdx

      # Generated testgen files carry 31 known type errors and still run.
      - name: typecheck
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/tsc.log || true
          if grep 'error TS' /tmp/tsc.log | grep -v 'tests/testgen_'; then
            echo "::error::typecheck failed outside generated tests"
            exit 1
          fi

      - name: tests
        run: bun run test

      - name: editor build
        run: bun run build:editor

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      # Committed generated TypeScript can drift from the .proto files.
      - name: generated code is current
        run: |
          buf generate
          git diff --exit-code -- packages/proto/src/gen \
            || { echo "::error::packages/proto/src/gen is stale -- run \`bun run proto:gen\`"; exit 1; }
