name: diagrams

on:
  pull_request:
    paths:
      - '**/*.diag.json'
      - '**/*.style.json'
      - '**/*.theme.json'
      - 'packages/core/**'
      - 'packages/ops/**'
      - 'packages/themes/**'
      - 'packages/proto/**'
      - 'proto/**'
      - 'scripts/pr_diagrams.ts'
      - 'scripts/pr_comment.ts'
      - '.github/workflows/diagrams.yml'

# Only what posting one comment needs. `pull_request` rather than
# `pull_request_target`: this job runs the pull request's own code, including
# whatever `bun install` executes, and pull_request_target would hand that a
# writable token. The cost is that a fork's pull request gets no comment,
# which the guard on the comment step makes explicit rather than a failure.
permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The head commit itself, not the merge commit this event checks out
          # by default: the comment's pictures are raw URLs at this SHA, so what
          # is rendered here has to be what that SHA holds.
          ref: ${{ github.event.pull_request.head.sha }}
          # The diff against the base branch needs its history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      # Where the pull request branched, not the tip of the base branch: the
      # tip may have moved on, and only the branch point shows what this
      # change did.
      - name: where this pull request branched
        id: base
        run: echo "sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)" >> "$GITHUB_OUTPUT"

      # A diagram is touched by a change to its source, its stylesheet, a theme,
      # or the renderer; the script knows which.
      - name: diagrams this pull request touches
        id: changed
        run: |
          bun run scripts/pr_diagrams.ts --base "${{ steps.base.outputs.sha }}" \
            --sha "${{ github.event.pull_request.head.sha }}" --list > changed.txt
          echo "count=$(grep -c . changed.txt || true)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      # --strict makes a committed SVG that no longer matches its source an
      # error, but the comment is written first and posted whatever happens, so
      # the author is told which one and how to fix it. The job is failed by the
      # last step instead, once the comment is up.
      - name: render them
        id: render
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        run: |
          bun run scripts/pr_diagrams.ts \
            --base "${{ steps.base.outputs.sha }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --strict \
            --out comment.md

      - name: post or update the comment
        # A fork's token is read-only, so this would fail rather than post. A
        # render that crashed wrote no comment, so there is nothing to post.
        if: >-
          always() &&
          steps.changed.outputs.count != '0' &&
          hashFiles('comment.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('node:fs').readFileSync('comment.md', 'utf8');
            const marker = '<!-- archeglyph-diagrams -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find((c) => c.body.startsWith(marker));

            if (mine === undefined) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            }

      - name: fail if a diagram is out of date
        if: steps.render.outcome == 'failure'
        run: |
          echo "A committed .svg no longer matches its .diag.json, or has none." >&2
          echo "The comment on this pull request says which, and how to fix it." >&2
          exit 1
