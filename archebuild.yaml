server:
  db_path: "./archebuild.db"

orchestrator:
  enabled: true

execution:
  max_parallelism: 5
  default_timeout_seconds: 1800
  executor: shell

  # Prompt templates rendered for the agent step, keyed by ChangeType.
  # Resolution at exec time:
  #   1. templates.<change_type> if non-empty (add / modify / delete)
  #   2. else templates.default
  templates:
    default: |
      Implement {{symbols}} in `{{file}}` ({{language}}, change_type={{change_type}}, kind={{kind}}).

      Description: {{description}}

      Spec + existing impl (if any):
      ```
      {{self}}
      ```

      Generated schema (on disk next to your target — empty for AGENT_ONLY):
      ```
      {{schema}}
      ```

      Types this references:
      {{out_dependency}}

      Contained members (methods/fields):
      {{out_containment}}

      Callers (where this is used):
      {{in_dependency}}

      Project rules (apply to every node — these are the project-wide conventions
      so individual decl docs don't need to restate them):

      Style + layout:
      - Follow `docs/style-guide.md` exactly. Its mechanical rules (§2) are derived
        from what archegraph extracts and verifies; its house style (§3) is short.
        Particularly relevant:
        - §2.2–2.3: annotate every parameter, return type and field; never put an
          inline union (`T | null`), intersection, or `any`/`unknown` in a signature
          or field — use the named aliases `Option<T>` / `Result<T, E>` from
          `@archeglyph/proto/util/result`, or a named alias declared once.
        - §2.4: no getters/setters, no function overloads, named imports/exports
          only (barrel re-exports are fine).
        - §1.5 / §3.2: `Result<T, E>` in pure logic; `try/catch` and `instanceof`
          only inside one named boundary function per interop surface (ELK, FSA,
          fetch, JSON.parse), which returns a Result.
        - §3.3: proto messages via `create(Schema, { ...existing, field })` (spread is
          fine); archebuild classes via `Object.assign(new Xxx(), {...})`.
        - Spread, destructuring, default params, per-method generics, `extends Error`
          are all allowed — do not write around them.
      - First line of every new file: `// SPDX-License-Identifier: AGPL-3.0-or-later`.
      - For services: write a class `<Interface>Impl implements <Interface>`.
        Import the interface and request/response types from `./schema_gen`.
        For data-model types (Diagram / Stylesheet / Theme etc.), import from the
        buf-generated path shown in `{{out_dependency}}` — typically
        `@archeglyph/proto/gen/<file>_pb`. Do NOT re-export `<Interface>` from
        impl.ts — the sibling `index.ts` barrel pulls it from schema_gen and would collide.

      Construction + types:
      - When constructing data objects, initialize all fields at construction with
        `Object.assign(new Xxx(), { field1, field2, ... })`. Do NOT construct with
        `new Xxx()` then assign fields individually after. Applies to every
        Request/Response/Output class in this codebase — they all use
        definite-assignment fields with no constructor.
      - For buf-generated proto values (anything from `@archeglyph/proto/gen/*_pb`):
        use `create(XSchema, { field1, field2 })` from `@bufbuild/protobuf`. NEVER
        `new XProtoMessage()` directly — protoc-gen-es emits a `Schema` factory and
        `create()` is the only supported construction path. Import the type AND its
        Schema from the same `_pb` module:
        `import { Theme, ThemeSchema } from '@archeglyph/proto/gen/theme_pb'`.
      - Discriminate proto `oneof` cases via the case property:
        `if (msg.payload.case === 'frame') { msg.payload.value... }`. The payload
        union is generated as `{ case: 'frame', value: Frame } | { case: undefined }`.
      - If a parameter comment says it is an array (e.g. "param is Foo[]"), declare
        it as `Foo[]` in TypeScript even if the schema skeleton shows `Foo`.

      Error handling — load-bearing distinction:
      - Result type: import `Result, Ok, Err` from `@archeglyph/proto/util/result`.
        Discriminate the union with `result.kind === 'err'`, NOT a truthy check on
        `result.error`. Both ok and err variants populate `.value` / `.error`
        respectively; only `.kind` is the safe discriminator.
      - In `@archeglyph/core/*` impls: NEVER throw. Return `Err(someError)`. Every
        core capability (loaders, resolver, validator, layout, renderer) returns
        Result<T, _>. Throwing inside core breaks the boundary the ops framework
        relies on.
      - In `@archeglyph/ops/<op>/op.ts` (the op boundary): throwing is the right
        thing. Wrap any stage's Err into the op's <Op>OpError (extends Error) and
        throw it. cli_main's catch block formats it for the user.
      - Loaders return `Promise<Result<T, LoadError>>` — await them. async stage
        impls likewise return Promise<Result<...>>. Sync stage impls return
        Result<...> directly (no Promise).

      File I/O patterns:
      - In ops/<op>/op.ts file reads: use Node's `readFile(resolve(ctx.projectRoot,
        params.x), 'utf8')`. Loaders take text, not bytes — always pass utf8.
      - In core/*: no direct file I/O. Stages operate on already-loaded proto values
        passed in via Request types.

      Build behavior:
      - Implement method bodies FULLY per the description. Do not stub with
        `throw new Error('not implemented')`.
      - For brownfield MODIFIED files: edit in place, preserve existing content.
      - Read adjacent files for patterns — they're the canonical reference. e.g.
        `renderOp` in `packages/ops/src/render/op.ts` is the canonical Operation
        literal example; `VisibilityFilterImpl` in `packages/core/src/resolver/
        visibility_filter/impl.ts` is the canonical sorted-key iteration example.

    delete: |
      Delete the symbol `{{symbol}}` ({{kind}}) from the codebase.

      File: {{file}}
      Description: {{description}}

      Existing definition (to remove):
      ```
      {{self}}
      ```

      Callers / referencers (already migrated by upstream nodes; do not touch):
      {{in_dependency}}

      Rules:
      - If `{{file}}` contained only `{{symbol}}` (no other top-level symbols),
        delete the whole file.
      - Otherwise, excise just the symbol's definition; leave everything else
        intact.

  commands:
    # gait-agent as the per-node worker: --gait-dir is gait's own workspace
    # (session history/undo), separate from the codebase per gait-agent skill's
    # rule. --codebase {{working_dir}} points it at THIS node's own worktree,
    # substituted by archegraph at exec time. --auto-approve plus the --allow
    # patterns below is "permissive" per the user's request. --inference
    # gpt-luna pins the model explicitly (also the gait workspace's configured
    # default). No git flags/commands passed to gait — archegraph's own
    # git.commit_template does the per-node commit after this command exits;
    # gait's job is file edits only, matching gait-agent's own "the
    # orchestrator commits" rule. UNVALIDATED against a real archegraph
    # per-node build as of authoring — sanity-check with a single-node build
    # (or --render-prompts dry run) before trusting this on a full run.
    - attempts: 4
      command: 'gait --gait-dir $HOME/Documents/gait-trace --codebase {{working_dir}} --auto-approve --allow "read:*" --allow "write:*" --allow "apply_patch:*" --allow "shell:*" --allow "glob:*" --allow "grep:*" --allow "ls:*" --inference gpt-luna "$(cat {{config_file}})"'

  # Cross-archegraph-boundary type imports. archegraph's TS codegen needs
  # to know how to spell the import for a foreign-namespace proto package
  # — info it can't derive (the proto only has its package FQN; the TS
  # specifier is a buf+npm convention). Map each external proto package
  # to its canonical buf-emitted module path. PR G feature.
  codegen:
    external_package_imports:
      "archeglyph.content.v1": "@archeglyph/proto/gen/content_pb"
      "archeglyph.style.v1":   "@archeglyph/proto/gen/style_pb"
      "archeglyph.theme.v1":   "@archeglyph/proto/gen/theme_pb"
      # Hand-authored utility module (not buf-generated). Lets specs
      # reference Result/Ok/Err via FQN `archeglyph.util.Result` etc.
      "archeglyph.util":       "@archeglyph/proto/util/result"
      # Vendored archegraph view types (see proto/archegraph/).
      "archegraph.view":       "@archeglyph/proto/gen/archegraph/view_pb"
      "archegraph.common":     "@archeglyph/proto/gen/archegraph/common_pb"

  # Refresh buf-generated TS before the build sees the source tree, so the
  # data-model types in `packages/proto/src/gen/` can never be stale w.r.t.
  # the .protos when compose / index runs against the worktree.
  pre_dag:
    # `-p archeglyph` pins the compose project name. Without it, compose
    # derives the project name from the worktree dir (e.g.
    # `archebuild-<id>-_dag`) which produces an invalid Docker image
    # reference (`-_` is rejected as malformed). Pinned name also caches
    # the built image across all per-DAG and per-node worktrees.
    #
    # `-T` disables pseudo-TTY allocation. The build server inherits its
    # parent shell's TTY; without -T, `docker compose run` allocates a
    # PTY and is then SIGTTIN-stopped the moment it tries to read input.
    # Buf is fully non-interactive so we don't need a TTY anyway.
    #
    # `bun install` runs first because each per-DAG worktree is a fresh
    # git checkout with no `node_modules/`. Without this step, `buf
    # generate`'s `bunx protoc-gen-es` falls through to the unscoped npm
    # name (the binary's name in @bufbuild/protoc-gen-es) and 404s. With
    # `--frozen-lockfile`, install is a few-second no-op-or-pull from the
    # bun cache — fast enough to run per build.
    - label: regen-proto
      # `< /dev/null`: the build server inherits its parent's tty as stdin
      # and forks children with that same stdin. `-T` disables docker's PTY
      # *output* allocation, but stdin still points at the user's tty. As
      # soon as anything inside the container probes stdin (bun install
      # progress UI does this), SIGTTIN stops the whole tree because the
      # child isn't the foreground process group. Redirecting stdin to
      # /dev/null severs the controlling-tty link cleanly.
      command: docker compose -p archeglyph run --rm -T dev bash -lc "bun install --frozen-lockfile && bun run proto:gen" < /dev/null

  # Auto-SCIP runs from cwd = worktree_root, and `npx @sourcegraph/scip-typescript`
  # needs the binary resolvable in `./node_modules/.bin/`. The link inherits the
  # project root's bun-installed deps (bun.lock pins @bufbuild/protoc-gen-es +
  # typescript). scip-typescript emits symbols based on AST + tsconfig include —
  # unresolved package imports don't block local symbol emission, so the
  # workspace-cross-package types resolve via tsconfig paths at typecheck time
  # without needing per-worktree node_modules surgery.
  post_dag:
    - label: link-node-modules
      command: |
        [ -e node_modules ] || ln -s ../../../node_modules node_modules

retries:
  agent: 3
  timeout: 3
  commit: 1

git:
  commit_template: "feat: {{node_label}}"
