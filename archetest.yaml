llm:
  command: "claude -p {prompt} --json-schema {schema} --output-format json --max-turns 50"

tests:
  # Re-enabled 2026-09-12 to retest the upstream fix. This was true on the
  # layout-pin run: property tests came out as `fc.property(el in
  # fc.record({...}))`, which is not valid syntax, fast-check was not a
  # declared dependency, and 19 of 72 emitted tests failed to parse -- taking
  # 15 planned cases with them including that pillar's headline invariant.
  # Filed upstream 2026-09-11; the archegraph agent believes it is fixed.
  #
  # If it is not, set this back to true. The cost of skipping is real: cases
  # flagged is_property simply vanish from the plan, so state an invariant as
  # a CONCRETE case in the spec wherever it can be.
  skip_property_tests: false
  language: typescript
