llm:
  command: "claude -p {prompt} --json-schema {schema} --output-format json --max-turns 50"

tests:
  # Retested 2026-09-12 on editor-annotations with this set to false. NOT
  # fixed: 90 occurrences of `fc.property(kind in fc.constantFrom(...))`, the
  # same invalid syntax as the 2026-09-11 layout-pin run, and fast-check is
  # still not a declared dependency. That run was also worse -- a filename
  # leaked into an import list (`import { TextEditor, text_editor.tsx } from
  # ...`) and 21 imports were emitted mid-file, so the output did not parse at
  # all and produced zero usable tests.
  #
  # Filed: concordium/archegraph/docs/feedback/
  # 2026-09-12-testgen-codegen-still-unusable-and-worse.md
  #
  # The cost of leaving this true is real: cases flagged is_property simply
  # vanish from the plan, so state an invariant as a CONCRETE case in the spec
  # wherever it can be, rather than as a general property.
  #
  # Note also that testgen writes packages/<pkg>/tests/testgen.test.ts and
  # will overwrite whatever is there without asking. The path is ONE PER
  # PACKAGE, not one per spec, so a run for pillar B silently destroys the
  # tests a run for pillar A left in the same package. Output does not
  # accumulate.
  #
  # CONVENTION, so this stops being rediscovered: treat tests/testgen.test.ts
  # as scratch that belongs to the most recent run. Anything worth keeping --
  # a case you repaired, or coverage of something no hand-written test reaches
  # -- gets PROMOTED to a permanent hand-maintained file named for what it
  # covers, with the generated header replaced so nobody regenerates over it:
  #
  #   packages/core/tests/layout_pinning_generated.test.ts   (layout + pins)
  #   packages/editor/tests/commands_generated.test.ts       (COMMANDS)
  #   packages/editor/tests/auto_layout_edit.test.ts         (repaired cases)
  #
  # Promote BEFORE the next run, not after -- afterwards it is a git archaeology
  # exercise instead of a git mv. See 6b9f2b9 for why a repair left under the
  # generated filename is a repair waiting to be silently reverted.
  skip_property_tests: true
  language: typescript
