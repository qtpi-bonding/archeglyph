llm:
  # No --allow flags: the prompt already embeds the symbol's source.
  # GAIT_DEBUG=1 keeps the workspace gait would delete; prune it.
  command: >-
    env GAIT_DEBUG=1
    gait
    --gait-dir $HOME/Documents/gait-trace
    --inference gpt-luna
    --result-schema-json {schema}
    -e {prompt}

# Pause after the plan passes; `archegraph test proceed` runs code generation.
gate:
  enabled: true

tests:
  skip_property_tests: false
  language: typescript

  # runner_command unset: testgen reads package.json's "test" script and appends
  # the node's own files, so per-node isolation keeps --conditions browser and
  # --preload. Setting it here would override that with a whole-suite run.

  # The emitted header is ours (archegraph shipped this 2026-09-20). Rules are
  # matched against the symbol's file_path, first match wins; a bare `*`
  # crosses `/` like `**` does. `_extend` appends after the default bun:test
  # header rather than replacing it.
  #
  # Both entries exist to stop the generators FABRICATING what they could not
  # import. Without `create` and the schemas, a test builds a proto message as
  # a cast object literal, which never deep-equals a message the code returned
  # -- nine failures in one editor-pending run. Without the render helpers, a
  # component case degrades to `expect(typeof X).toBe('function')`.
  #
  # Static imports are safe here: test/solid_preload.ts registers happy-dom
  # globally before any test module evaluates, so a component import does not
  # need the dynamic-import dance the hand-written widget tests use.
  import_header_rules:
    - glob: "packages/editor/src/*.tsx"
      import_header_extend: |
        import { create } from '@bufbuild/protobuf';
        import { render, fireEvent, cleanup } from '@solidjs/testing-library';
        import { createSignal } from 'solid-js';
    - glob: "packages/editor/src/*.ts"
      import_header_extend: |
        import { create } from '@bufbuild/protobuf';

  framework_notes: >-
    FEWER CORRECT TESTS BEAT MORE TESTS. A case you decline costs nothing; a
    case that asserts something false costs a whole build to diagnose, because
    it fails against correct code and reads as if the code were wrong. When you
    are unsure whether an assertion holds, drop it. When you are unsure whether
    a case can be tested at all, decline it. Never pad.

    You return only a body, never an import statement -- the header is fixed
    before you are called. Everything in the import list shown above IS in
    scope and you should use it rather than hand-rolling a substitute. For
    editor sources that includes `create` from '@bufbuild/protobuf', and for
    `.tsx` sources also `render`, `fireEvent` and `cleanup` from
    '@solidjs/testing-library' and `createSignal` from 'solid-js'. Nothing
    outside that list is in scope.
    There is no `vi` and no `jest`: this runs on bun:test, not Vitest or Jest.
    For a test double use `mock(() => ...)` and `spyOn(obj, 'name')`, which are
    bun:test exports -- but only if they appear in the import list above;
    otherwise write a plain local stub function that records its calls.
    A DOM IS registered before your test runs, so mounting a component is
    allowed wherever `render` appears in the import list. Call `cleanup()`
    after a render. There is still no `screen` and no `waitFor`: query the
    container `render` returns.
    If a case cannot be tested within these limits, decline it. In particular
    never fall back to asserting that the symbol is a function, that a
    generated value is defined, or that a member is absent -- the last is
    actively wrong when the spec is about to add it.
    Assert only through the declared interface. Never add a field or
    collaborator to a parameter type to make a call observable -- a test that
    invents a seam passes only against a shape nobody implements. When a call
    to an imported function is not reachable through the declared type, assert
    the state change it produces instead.
    Every assertion must hold for every member of the strategy's domain. Before
    adding an assertion beyond the one the case names, check it against the
    domain's edges; if it fails for any member, narrow the domain or drop the
    assertion. `fc.anything()` yields `undefined`, so pairing it with
    `expect(value).toBeDefined()` fails on its own domain; `fc.string()`
    includes the empty string.

    You are writing tests for code THAT DOES NOT EXIST YET. The source you are
    shown is the state before this change, and the spec's description is the
    state after. Where they disagree, the description wins: a member the
    description declares is one the code will have by the time this test runs.

    Build protobuf messages with `create(SomeSchema, { ... })`, never as a cast
    object literal. A literal is NOT equal to a message the code returned --
    messages carry internal fields, so `toEqual` fails on a difference that has
    nothing to do with the behaviour.
