llm:
  command: "claude -p {prompt} --json-schema {schema} --output-format json --max-turns 50"

tests:
  # Retested 2026-09-12 on editor-annotations with this set to false. NOT
  # fixed: 90 occurrences of `fc.property(kind in fc.constantFrom(...))`, the
  # same invalid syntax as the 2026-09-11 layout-pin run, and fast-check is
  # still not a declared dependency. That run was also worse -- a filename
  # leaked into an import list (`import { TextEditor, text_editor.tsx } from
  # ...`) and 21 imports were emitted mid-file, so the output did not parse at
  # all and produced zero usable tests.
  #
  # Filed: concordium/archegraph/docs/feedback/
  # 2026-09-12-testgen-codegen-still-unusable-and-worse.md
  #
  # The cost of leaving this true is real: cases flagged is_property simply
  # vanish from the plan, so state an invariant as a CONCRETE case in the spec
  # wherever it can be, rather than as a general property.
  #
  # Note also that testgen writes packages/<pkg>/tests/testgen.test.ts and
  # will overwrite whatever is there without asking.
  skip_property_tests: true
  language: typescript
