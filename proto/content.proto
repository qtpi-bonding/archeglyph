syntax = "proto3";
package archeglyph.content.v1;

// ============================================================================
// 1. ENVELOPE
// ============================================================================

// Diagram is the file-level artifact: a Graph + presentation envelope metadata.
message Diagram {
  uint32 schema_version = 1;

  // Stable id for this diagram artifact. Required.
  string id = 2;

  // Human-readable title (localizable). Used by tooling/file-pickers;
  // NOT rendered into the SVG by default.
  repeated Localization title = 3;

  // The graph topology.
  Graph graph = 4;

  // Envelope-level metadata.
  DiagramMetadata metadata = 5;
}

message DiagramMetadata {
  // Where this diagram came from: "hand", "archegraph-importer-v1", etc.
  optional string generator = 1;

  // ISO 8601 timestamps.
  optional string created_at = 2;
  optional string updated_at = 3;

  // BCP 47 code of the canonical Localization to fall back to when render-time
  // --locale doesn't match any explicit Localization entry.
  // Defaults to "en" if unset.
  optional string canonical_locale = 4;

  // Free-form, namespaced keys. Convention: "<tool>.<key>".
  // e.g., "archegraph.source_commit", "archegraph.symbol_root".
  map<string, string> extra = 10;
}

// ============================================================================
// 2. GRAPH (pure topology — could be used standalone)
// ============================================================================

message Graph {
  // Nodes keyed by id. The key is the node's identity; Node carries no id field.
  // Iteration during render: sorted lex by key.
  map<string, Node> nodes = 1;

  // Edges keyed by id. The key is the edge's identity; Edge carries no id field.
  // Convention: "<source>__<target>", optional "__<n>" suffix when multiple.
  // Multiple edges between same (source, target) supported via different ids.
  map<string, Edge> edges = 2;

  // Groups keyed by id. The key is the group's identity; Group carries no id field.
  // Groups may nest (a group's parent_group references another group).
  map<string, Group> groups = 3;
}

message Node {
  // Display label (one Localization entry per locale).
  // Render picks based on --locale flag, falls back to canonical_locale's entry.
  // If empty, renderer falls back to the map key for display.
  repeated Localization label = 2;

  // Containing group (single physical containment; cross-cutting concerns use tags).
  // Groups may themselves have a parent_group → nested hierarchy supported.
  optional string parent_group = 3;

  // Free-form, namespaced tags. e.g., "archegraph.symbol", "team": "backend".
  // Categorization (what was previously the `kind` field) goes here by convention —
  // common keys: "kind", "type", "layer", "domain". Authors pick what suits their
  // domain. Importers use namespaced keys (e.g., "archegraph.kind").
  map<string, string> tags = 4;
}

message Edge {
  // Source node id. Must reference an existing node.
  string source = 2;

  // Target node id.
  string target = 3;

  // Display label (localizable).
  repeated Localization label = 4;

  // Disambiguates multiple edges between same (source, target).
  uint32 ordinal = 5;

  // Free-form tags. Categorization goes here (e.g., "kind": "depends_on").
  map<string, string> tags = 6;
}

message Group {
  // Display label (localizable).
  repeated Localization label = 2;

  // Parent group id, for nested groups. Empty = top-level group.
  // Group hierarchy must be acyclic (validation enforces).
  optional string parent_group = 3;

  // Free-form tags.
  map<string, string> tags = 4;
}

// ============================================================================
// 2b. DELTA (diff between two Diagram states — always computed, never
//     hand-authored; see docs/superpowers/specs/2026-09-07-delta-diff-design.md)
// ============================================================================

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  UNCHANGED = 1;
  ADDED = 2;
  DELETED = 3;
  MODIFIED = 4;
}

message Delta {
  uint32 schema_version = 1;

  // Opaque provenance labels for the two states being compared: a git SHA
  // when the Delta came from archegraph, a diagram id or file path for a
  // hand-authored diff, or blank if the caller has nothing better. No
  // semantics are enforced on the value.
  string base_ref = 2;
  string target_ref = 3;

  repeated NodeDelta node_deltas = 4;
  repeated EdgeDelta edge_deltas = 5;

  // Groups are topology, not presentation: they live in Graph alongside nodes
  // and edges, and only their render_mode (in the STYLE file) is presentational.
  // Without this, adding or deleting a group produced nothing while re-parenting
  // a node did -- so a containment change reported half of itself.
  repeated GroupDelta group_deltas = 6;
}

message NodeDelta {
  string node_id = 1;
  ChangeType change_type = 2;
  optional Node before = 3;
  optional Node after = 4;

  // Free-text rationale, carried over from archegraph's ViewNodeDelta.description
  // when imported (Path A); blank for archeglyph's own diff() (Path B), which has
  // no source of rationale text to draw from.
  optional string description = 5;
}

message EdgeDelta {
  // Matches Edge.id (archeglyph's own stable edge key), not archegraph's
  // (source, target, edge_kind) triple.
  string edge_id = 1;
  ChangeType change_type = 2;
  optional Edge before = 3;
  optional Edge after = 4;
  optional string description = 5;
}

message GroupDelta {
  string group_id = 1;
  ChangeType change_type = 2;

  // Carries the group's own fields only. Membership is NOT here -- containment
  // lives per-node on Node.parent_group -- so rendering a DELETED group means
  // recovering its members from their own NodeDelta.before.parent_group. This
  // message alone would draw an empty box.
  optional Group before = 3;
  optional Group after = 4;

  optional string description = 5;
}

// ============================================================================
// 3. LOCALIZATION (one locale's text content)
// ============================================================================

// One locale's version of a text. Markdown source with KaTeX-style math.
// Used as `repeated Localization` wherever localizable text is needed
// (Node/Edge/Group `label`, Diagram `title`, AnnotationEntry `content`).
//
// Document's DiagramMetadata.canonical_locale determines which entry is the
// fallback when render-time --locale doesn't match any explicit entry.
//
// Markdown formatting (rendered in v2+, treated literally in v1):
//   plain text                       -> as-is
//   **bold**, *italic*               -> formatting
//   _underline_, ~~strikethrough~~   -> formatting
//   `inline code`                    -> monospace
//   [link text](url)                 -> hyperlink
//   \n                               -> line break
//
// Math (KaTeX convention; rendered in v2+):
//   $...$                            -> inline math
//   $$...$$                          -> display math (larger, block-level)
message Localization {
  // BCP 47 locale code, e.g., "en", "es", "fr-CA", "zh-Hans".
  string locale = 1;

  // Markdown source in this locale.
  string source = 2;
}
