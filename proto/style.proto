syntax = "proto3";
package archeglyph.style.v1;

import "content.proto";   // for Localization (used by AnnotationEntry.content)

// ============================================================================
// 1. ENVELOPE
// ============================================================================

message Stylesheet {
  uint32 schema_version = 1;

  // Path or name of theme to apply (resolved by the loader).
  optional string theme_ref = 2;

  // Document-level canvas style.
  optional CanvasStyle canvas = 3;

  // Per-element style entries — four parallel maps, keyed by element id.
  map<string, NodeStyleEntry> nodes = 4;
  map<string, EdgeStyleEntry> edges = 5;
  map<string, GroupStyleEntry> groups = 6;
  // Annotations — floating text/decoration on the canvas, not part of the
  // graph topology. Authored by the user; not produced by importers.
  // Whole annotation lives here (content + layout + glyphs) since they're
  // pure presentation.
  map<string, AnnotationEntry> annotations = 7;

  // Pending edits — StyleEdits with state=PENDING (awaiting user review).
  // Used by AI/MCP "propose" workflows; visible in the editor as a ghost overlay.
  // Each StyleEdit is atomic — accept or reject as a unit.
  // APPLIED edits don't live here (they've already been written into entries above);
  // REJECTED edits are dropped or moved out.
  // See §10 below for StyleEdit structure.
  repeated StyleEdit pending_edits = 8;
}

// Per-document canvas styling. Lives in Stylesheet only. Theme expresses
// canvas-related defaults via tokens (theme.tokens.colors["background"],
// theme.tokens.sizes["node_spacing"], etc.) which stylesheets can reference.
//
// Resolver fallback for unset fields: theme token (if a conventional name
// exists) → hardcoded code default.
message CanvasStyle {
  optional Color background = 1;
  optional Vec2 viewport_size = 2;
  optional double margin = 3;
  optional double node_spacing = 4;       // elkjs hint
  optional double edge_spacing = 5;       // elkjs hint
}

// ============================================================================
// 2. STYLE ENTRIES — four element-typed messages, parallel structure
// ============================================================================
// Each style entry holds: layout + visual glyphs + component binding.
// Visual is split into 2-3 separate glyph fields per element type:
//   - shape:      Glyph2D     (the body — for shape-based elements)
//   - connection: Glyph1D     (the line — for line-based elements)
//   - text:       Typography  (text styling — for any element with a label)
//   - callout:    Glyph1D     (annotation-specific — line to anchor)

message NodeStyleEntry {
  optional NodeLayout layout = 1;
  optional Glyph2D shape = 2;                  // body
  optional Typography typography = 3;          // text styling
  optional string component = 4;               // theme component name binding
  optional NodeVisibility visibility = 5;      // hide / contract for readability (presentation only)
}

message EdgeStyleEntry {
  optional EdgeLayout layout = 1;
  optional Glyph1D connection = 2;             // line
  optional Typography typography = 3;
  optional string component = 4;
  // No visibility field — edges have no honest "hide" operation. Edge rendering
  // is derived from its endpoints' visibility (per §2.8). If you want to "remove"
  // an edge from view, contract or hide one of its nodes.
}

message GroupStyleEntry {
  optional GroupLayout layout = 1;
  optional Glyph2D shape = 2;
  optional Typography typography = 3;
  optional string component = 4;
  // No visibility field on groups either. The render-mode (default / collapsed /
  // flat) is in GroupLayout.render_mode — see §3 LAYOUT below.
}

// ============================================================================
// Visibility — node-only, presentation-only hiding.
// Per §2.8: these only affect rendering. The content file (graph topology)
// is unchanged. Edges follow their endpoints (no edge visibility). Groups have
// render-modes in GroupLayout — including CONTRACTED to roll up into a super-node.
// To elide a chain of nodes: group them and CONTRACT the group.
// ============================================================================

enum NodeVisibility {
  NODE_VISIBILITY_UNSPECIFIED = 0;       // visible (default)
  NODE_VISIBILITY_HIDDEN = 1;            // vanish; edges incident to this node also disappear
}

// (No per-entry proposal_state / proposal_author. Proposed changes live in
// Stylesheet.pending_edits as StyleEdit messages — see §10. Once accepted,
// changes are applied to entries directly; entries are always "committed".)

// ============================================================================
// 3. LAYOUT — four messages, one per element type
// ============================================================================
// Geometric concerns: position, size, rotation, edge routing, label-position-
// along-path. Per §2.7 — structural defaults are NOT in the schema; the layout
// code picks defaults when fields are unset.

message NodeLayout {
  optional Vec2 position = 1;            // relative to parent (canvas or group)
  optional Vec2 size = 2;
  optional double rotation = 3;          // degrees
}

message EdgeLayout {
  optional EdgeRouting routing = 1;             // STRAIGHT | ORTHOGONAL | CURVED | MANUAL
  repeated Vec2 waypoints = 2;                  // used when routing = MANUAL
  // Optional attachment hints. Coordinates are element-local normalized:
  // (0, 0) is element center, (1, 0) is right of bbox, (0, -1) is top.
  // The point is projected onto the element's actual outline at render
  // time — works uniformly for any shape (rect, polygon, ellipse, custom
  // path, group container). Unset on either side → layout decides for that
  // endpoint.
  optional Vec2 source_attach = 3;
  optional Vec2 target_attach = 4;
  // Where the label sits along the edge path. Geometric concern, not typography.
  optional EdgePathPosition label_position = 5;        // START | MIDDLE | END | CUSTOM
  optional double label_position_fraction = 6;         // 0..1 when label_position = CUSTOM
}

message GroupLayout {
  optional Vec2 position = 1;
  optional Vec2 size = 2;
  optional double padding = 3;
  // Render mode — captures the three meaningful presentations of a group.
  // (Replaces the earlier `bool collapsed` field; collapsed is now one of three modes.)
  optional GroupRenderMode render_mode = 4;
  // Where the group label sits relative to the group box. Geometric concern.
  optional GroupLabelPosition label_position = 5;
}

enum GroupRenderMode {
  GROUP_RENDER_MODE_UNSPECIFIED = 0;     // default — same as BOUNDED
  GROUP_RENDER_MODE_BOUNDED = 1;         // children visible, INSIDE a boundary box
  GROUP_RENDER_MODE_EXPANDED = 2;        // children visible, NO boundary rendered (group's spatial extent absorbed by parent)
  GROUP_RENDER_MODE_CONTRACTED = 3;      // single super-node; children hidden;
                                          // cross-boundary edges terminate at the super-node
}

message AnnotationLayout {
  optional Vec2 position = 1;            // canvas-relative, or anchor-parent-relative
  optional Vec2 size = 2;
  optional double rotation = 3;
}

enum EdgeRouting {
  ROUTING_UNSPECIFIED = 0;
  ROUTING_STRAIGHT = 1;
  ROUTING_ORTHOGONAL = 2;
  ROUTING_CURVED = 3;
  ROUTING_MANUAL = 4;
}

enum EdgePathPosition {
  PATH_POSITION_UNSPECIFIED = 0;
  PATH_POSITION_START = 1;
  PATH_POSITION_MIDDLE = 2;
  PATH_POSITION_END = 3;
  PATH_POSITION_CUSTOM = 4;
}

enum GroupLabelPosition {
  GROUP_LABEL_UNSPECIFIED = 0;
  GROUP_LABEL_TOP_LEFT = 1;
  GROUP_LABEL_TOP_CENTER = 2;
  GROUP_LABEL_TOP_RIGHT = 3;
  GROUP_LABEL_BOTTOM_LEFT = 4;
  GROUP_LABEL_BOTTOM_CENTER = 5;
  GROUP_LABEL_BOTTOM_RIGHT = 6;
}

// ============================================================================
// 4. GLYPH TYPES — three visual primitives
// ============================================================================
// Glyph2D: visual identity of a shape-based element (Node, Group, Annotation).
//          Geometry + outline + fill + halo + decorations.
// Glyph1D: visual identity of a line-based element (Edge, Annotation callout).
//          Stroke + arrowheads + glow.
// Typography: visual identity of text. Combined with Localization (the content),
//             produces visible text.

message Glyph2D {
  // Shape kind — exactly one of standard or custom path.
  // When unset, renderer picks code default (typically SHAPE_RECT).
  oneof shape_kind {
    ShapeType standard = 1;                   // standard vocabulary; see ShapeType
    string custom_path_ref = 2;               // "$shape_paths.my_icon" — token reference
  }
  optional double corner_radius = 4;
  optional Stroke stroke = 5;                 // outline
  optional Fill fill = 6;                     // body fill
  optional Glow glow = 7;                     // halo around the shape
  repeated Decoration decorations = 8;        // badges/icons attached to the shape
}

message Glyph1D {
  optional Stroke stroke = 1;                 // line styling
  optional Arrowheads arrowheads = 2;         // start/end arrow variants
  optional Glow glow = 3;                     // halo around the line
}

message Typography {
  optional string font = 1;                   // "$fonts.heading" or literal
  optional Color color = 2;
  optional double size = 3;
  optional FontWeight weight = 4;
  optional TextAlign align = 5;
  optional bool visible = 6;
  optional Color background = 7;              // text background highlight (useful on edges)
}

// ============================================================================
// 5. DIMENSION MESSAGES (used inside the glyph types)
// ============================================================================

// Standard shape vocabulary. Regular n-gons (TRIANGLE..DECAGON) are inscribed
// in the element's bbox with one vertex at the top. RECT is axis-aligned and
// supports `corner_radius` for rounded corners (set radius high enough and
// equal width/height → effectively a circle). ELLIPSE fills the bbox (equal
// width/height → circle). CYLINDER is a special DB-icon shape.
// For anything outside this list, use Glyph2D.shape_kind.custom_path_ref.
// New shapes can be added by appending enum values; ordering here is intentional
// (regular polygons by side count, then curved primitives).
enum ShapeType {
  SHAPE_UNSPECIFIED = 0;
  SHAPE_TRIANGLE = 1;
  SHAPE_RECT = 2;
  SHAPE_PENTAGON = 3;
  SHAPE_HEXAGON = 4;
  SHAPE_HEPTAGON = 5;
  SHAPE_OCTAGON = 6;
  SHAPE_NONAGON = 7;
  SHAPE_DECAGON = 8;
  SHAPE_ELLIPSE = 9;
  SHAPE_CYLINDER = 10;
}

message Stroke {
  // Paint — exactly one of solid color or gradient. Unset = renderer code default.
  oneof paint {
    Color color = 1;
    Gradient gradient = 8;
  }
  optional double width = 2;
  // Dash pattern — exactly one of standard or custom. Unset = solid.
  oneof dashing {
    StrokePattern pattern = 3;        // SOLID | DASHED | DOTTED
    string custom_dasharray = 7;      // "5,5", "2,2,5,5", etc.
  }
  optional StrokeCap cap = 5;
  optional StrokeJoin join = 6;
}

enum StrokePattern {
  STROKE_PATTERN_UNSPECIFIED = 0;
  STROKE_PATTERN_SOLID = 1;
  STROKE_PATTERN_DASHED = 2;
  STROKE_PATTERN_DOTTED = 3;
}

enum StrokeCap {
  CAP_UNSPECIFIED = 0;
  CAP_BUTT = 1;
  CAP_ROUND = 2;
  CAP_SQUARE = 3;
}

enum StrokeJoin {
  JOIN_UNSPECIFIED = 0;
  JOIN_MITER = 1;
  JOIN_ROUND = 2;
  JOIN_BEVEL = 3;
}

message Fill {
  // Paint — exactly one of solid color or gradient. Unset = no fill.
  oneof paint {
    Color color = 1;
    Gradient gradient = 3;
  }
  optional double opacity = 2;
}

message Gradient {
  GradientType type = 1;
  repeated GradientStop stops = 2;
  optional double angle = 3;            // for LINEAR, in degrees
}

message GradientStop {
  double offset = 1;                    // 0..1
  Color color = 2;
}

enum GradientType {
  GRADIENT_UNSPECIFIED = 0;
  GRADIENT_LINEAR = 1;
  GRADIENT_RADIAL = 2;
}

message Glow {
  optional Color color = 1;
  optional double radius = 2;          // halo size in px
  optional double intensity = 4;       // 0..1
}

enum FontWeight {
  WEIGHT_UNSPECIFIED = 0;
  WEIGHT_LIGHT = 1;
  WEIGHT_NORMAL = 2;
  WEIGHT_MEDIUM = 3;
  WEIGHT_SEMIBOLD = 4;
  WEIGHT_BOLD = 5;
}

enum TextAlign {
  ALIGN_UNSPECIFIED = 0;
  ALIGN_CENTER = 1;
  ALIGN_LEFT = 2;
  ALIGN_RIGHT = 3;
}

message Arrowheads {
  ArrowheadVariant start = 1;
  ArrowheadVariant end = 2;
  optional double size = 3;
}

enum ArrowheadVariant {
  ARROWHEAD_UNSPECIFIED = 0;
  ARROWHEAD_NONE = 1;
  ARROWHEAD_OPEN = 2;
  ARROWHEAD_FILLED = 3;
  ARROWHEAD_DIAMOND = 4;
  ARROWHEAD_CIRCLE = 5;
  ARROWHEAD_TEE = 6;
}

message Decoration {
  string id = 1;
  DecorationKind kind = 2;                              // BADGE | ICON

  // For BADGE: localizable text content. Same pattern as Node.label, Edge.label,
  // AnnotationEntry.content — one Localization entry per locale, renderer picks
  // based on --locale flag.
  repeated archeglyph.content.v1.Localization badge_text = 3;

  // For ICON: theme icon reference (e.g., "$shape_paths.warning").
  optional string icon_ref = 4;

  // Element-local normalized position hint, projected onto the element's
  // actual outline at render time. (1, -1) = top-right of bbox, (-1, -1) =
  // top-left, (1, 1) = bottom-right, (-1, 1) = bottom-left. Same convention
  // and projection as edge attachment hints. Unset → renderer picks a
  // sensible default (typically the top-right area of the bbox).
  optional Vec2 position = 5;
  optional Color color = 6;
}

enum DecorationKind {
  DECORATION_UNSPECIFIED = 0;
  DECORATION_BADGE = 1;
  DECORATION_ICON = 2;
}

// ============================================================================
// 6. PRIMITIVES
// ============================================================================

message Vec2 {
  double x = 1;
  double y = 2;
}

message Color {
  string value = 1;     // "#3B82F6" or "$colors.primary" (token ref)
}

// ============================================================================
// 7. RefKind enum (used by AnnotationAnchor)
// ============================================================================

enum RefKind {
  REF_KIND_UNSPECIFIED = 0;
  REF_KIND_NODE = 1;
  REF_KIND_EDGE = 2;
  REF_KIND_GROUP = 3;
}

// ============================================================================
// 8. ANNOTATIONS — floating text/decoration on the canvas
// ============================================================================
//
// (Note: there's no separate match/overlay/filter concept in the schema.
// Match-based binding is done by external tools — `archeglyph bind` CLI,
// importers, or AI agents — which produce explicit per-element style entries
// as their output. The stylesheet always contains explicit data, no rules.
// See §6 CLI surface for the bind tool.)
// ============================================================================
// Annotations are visually identical to nodes (they're shape-based with text)
// PLUS an optional callout line (Glyph1D) when anchored. Reuses Glyph2D and
// Typography from above — same vocabulary as nodes.

message AnnotationEntry {

  // Text content (localizable).
  repeated archeglyph.content.v1.Localization content = 2;

  // Optional anchor — when set, annotation visually points at a graph element.
  // Renderer draws the callout line (Glyph1D) from the annotation to the anchor.
  optional AnnotationAnchor anchor = 3;

  // Annotations are always explicitly positioned (no auto-layout).
  optional AnnotationLayout layout = 4;

  // Visual — annotations look like nodes (same Glyph2D + Typography vocabulary).
  optional Glyph2D shape = 5;
  optional Typography typography = 6;
  // Callout line styling — only meaningful when anchor is set.
  optional Glyph1D callout = 7;

  // Theme component preset binding.
  optional string component = 8;

  // Free-form tags.
  map<string, string> tags = 9;
}

message AnnotationAnchor {
  string ref_id = 1;                          // node/edge/group id
  RefKind ref_kind = 2;                       // REF_KIND_NODE | REF_KIND_EDGE | REF_KIND_GROUP
  // Element-local normalized hint for where on the target the callout
  // attaches. Same convention as edge attachment and decoration position:
  // (0, -1) = top, (1, 0) = right, etc. Projected onto the target's actual
  // outline at render time. Unset → renderer picks the closest outline
  // point to the annotation (i.e., the previous AUTO behavior).
  optional Vec2 anchor_position = 3;
}

// ============================================================================
// 10. STYLE EDITS — unified change/edit/proposal concept
// ============================================================================
//
// A StyleEdit represents a coherent change to the stylesheet — element-grouped,
// categorically tagged, with author/rationale/lifecycle. ONE message type covers
// both direct edits (WYSIWYG drags, immediate-apply) and review-pending proposals
// (AI suggestions). The `state` field discriminates.
//
// Modeled conceptually on archegraph's GraphDelta but adapted: we don't ship
// `before` snapshots because the current stylesheet IS the local before-state.
//
// SCOPE: StyleEdit is for STYLE FILE mutations only — the AI equivalent of
// what the WYSIWYG editor can do. It can NOT propose changes to the graph
// topology (Node/Edge/Group additions/removals/edits) — those would require
// a parallel ContentEdit concept (deferred; see §15).

message StyleEdit {
  uint32 schema_version = 1;

  // Stable id (deterministic 16-char hex prefix of sha256 over canonical contents).
  string id = 2;

  // Hash of the stylesheet this edit was authored against (for staleness check).
  optional string base_hash = 3;

  // Per-element changes — four parallel lists, one per element type.
  repeated NodeStyleChange node_changes = 4;
  repeated EdgeStyleChange edge_changes = 5;
  repeated GroupStyleChange group_changes = 6;
  repeated AnnotationStyleChange annotation_changes = 7;

  // Document-level changes (optional; affect Stylesheet.canvas / theme_ref).
  optional CanvasStyle canvas_after = 8;
  optional string theme_ref_after = 9;

  // Metadata
  optional string author = 10;            // "ai:claude", "user:alice", "importer:archegraph"
  optional string description = 11;       // overall rationale ("Color all backend services blue")
  uint64 timestamp_ms = 12;

  // Lifecycle.
  StyleEditState state = 13;
  optional string reviewed_by = 14;
  optional uint64 reviewed_at_ms = 15;

  // Discussion thread on this edit. Comments may be from user or AI, threaded
  // via reply_to. Allows revisions to be discussed before accept/reject. Particularly
  // valuable for AI workflows where the user can ask the AI to revise a proposal
  // ("less saturated please") and the AI responds in-thread with an updated
  // after-state. Optional — many edits won't have a thread.
  optional CommentThread thread = 16;
}

message NodeStyleChange {
  string node_id = 1;
  StyleChangeType change_type = 2;        // ADDED | DELETED | MODIFIED
  optional NodeStyleEntry after = 3;      // populated for ADDED/MODIFIED; partial fields supported
  repeated string unset_paths = 4;        // explicit field-clearing (e.g., "shape.stroke", "typography.color")
  repeated StyleChangeKind kinds = 5;     // categorical tags
  optional string description = 6;        // per-element rationale
}

message EdgeStyleChange {
  string edge_id = 1;
  StyleChangeType change_type = 2;
  optional EdgeStyleEntry after = 3;
  repeated string unset_paths = 4;
  repeated StyleChangeKind kinds = 5;
  optional string description = 6;
}

message GroupStyleChange {
  string group_id = 1;
  StyleChangeType change_type = 2;
  optional GroupStyleEntry after = 3;
  repeated string unset_paths = 4;
  repeated StyleChangeKind kinds = 5;
  optional string description = 6;
}

message AnnotationStyleChange {
  string annotation_id = 1;
  StyleChangeType change_type = 2;
  optional AnnotationEntry after = 3;
  repeated string unset_paths = 4;
  repeated StyleChangeKind kinds = 5;
  optional string description = 6;
}

enum StyleChangeType {
  STYLE_CHANGE_TYPE_UNSPECIFIED = 0;
  STYLE_CHANGE_TYPE_ADDED = 1;          // new entry/annotation appearing
  STYLE_CHANGE_TYPE_DELETED = 2;        // entry/annotation removed
  STYLE_CHANGE_TYPE_MODIFIED = 3;       // existing entry/annotation changed
}

enum StyleChangeKind {
  STYLE_CHANGE_KIND_UNSPECIFIED = 0;
  STYLE_CHANGE_KIND_LAYOUT = 1;         // position, size, rotation, routing, collapse
  STYLE_CHANGE_KIND_SHAPE = 2;          // Glyph2D changed (shape, stroke, fill, glow, decorations)
  STYLE_CHANGE_KIND_CONNECTION = 3;     // Glyph1D changed (edges)
  STYLE_CHANGE_KIND_TYPOGRAPHY = 4;     // Typography changed
  STYLE_CHANGE_KIND_CALLOUT = 5;        // annotation callout styling
  STYLE_CHANGE_KIND_COMPONENT = 6;      // theme component binding
  STYLE_CHANGE_KIND_ANCHOR = 7;         // annotation anchor target
  STYLE_CHANGE_KIND_CONTENT = 8;        // annotation text content
}

enum StyleEditState {
  STYLE_EDIT_STATE_UNSPECIFIED = 0;
  STYLE_EDIT_STATE_PENDING = 1;         // awaiting review (stored in Stylesheet.pending_edits)
  STYLE_EDIT_STATE_APPLIED = 2;         // committed — was either direct or accepted from review
  STYLE_EDIT_STATE_REJECTED = 3;        // was proposed, user rejected
}

// ============================================================================
// Comment threads — discussion on StyleEdits
// ============================================================================
// Comments live in a thread attached to a StyleEdit. Authors can be users or AI;
// replies form a tree via the reply_to field. Threads can be resolved (e.g., after
// the edit is accepted or the discussion concludes).
//
// Comments are NOT localized — each comment is a per-author message in one
// language. The diagram itself can be rendered in any locale; the discussion
// stays in whatever language it was written in.

message CommentThread {
  repeated Comment comments = 1;

  // True when the discussion is concluded. UI may collapse resolved threads.
  bool resolved = 2;

  optional string resolved_by = 3;
  optional uint64 resolved_at_ms = 4;
}

message Comment {
  // Stable id (deterministic 16-char hex prefix of sha256 over canonical contents).
  string id = 1;

  // "user:alice", "ai:claude", "ai:gpt-4", etc.
  optional string author = 2;

  uint64 timestamp_ms = 3;

  // Markdown body. Same conventions as Localization.source (markdown + KaTeX math).
  string body = 4;

  // For threading: id of the comment this replies to. Empty = top-level comment
  // (a direct reply to the StyleEdit itself). Renderer/UI assembles a tree from
  // these flat references.
  optional string reply_to = 5;
}
