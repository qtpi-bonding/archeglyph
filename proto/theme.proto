syntax = "proto3";
package archeglyph.theme.v1;

import "style.proto";

message Theme {
  uint32 schema_version = 1;
  string name = 2;
  optional string description = 3;

  // Future: theme inheritance. v1: empty.
  optional string extends = 4;

  // Primitive design values. Token references in style files use these.
  Tokens tokens = 5;

  // Named components per element type. Each component is referenced by
  // `name` from style entries' `component` field. No match expressions —
  // binding is always explicit, produced by external tools or hand-authoring.
  repeated NodeComponent       node_components = 6;
  repeated EdgeComponent       edge_components = 7;
  repeated NodeComponent       group_components = 8;       // groups use NodeComponent
  repeated AnnotationComponent annotation_components = 9;

  // The component each element type falls back to when its style entry names
  // none. Binding stays explicit — the RESOLVER never guesses a name; the
  // THEME states its own default here, and a theme that omits these leaves
  // unbound elements unstyled, which is what design.md §5 describes.
  //
  // This exists because a diagram with no stylesheet at all is the normal
  // starting point, and it must still render. Before these fields the resolver
  // hardcoded the name "glyph", which meant no theme could define a component
  // called "glyph" without it silently capturing every unbound element.
  // The bundled themes set these to "glyph"; the name is now ordinary.
  optional string default_node_component       = 10;
  optional string default_edge_component       = 11;
  optional string default_group_component      = 12;
  optional string default_annotation_component = 13;

  // No canvas field on Theme. Canvas is per-document data, lives in Stylesheet.
  // A theme expresses its canvas default through the reserved `background`
  // role — tokens.roles["background"] — which the cascade looks up directly
  // rather than by injecting a reference and hoping the resolver substitutes
  // it. A stylesheet's own canvas.background wins when set; absent both, the
  // diagram renders transparent.
}

// ============================================================================
// COMPONENT BUNDLES — typed groupings of glyphs per element type.
// Each is name-bound only; the name is referenced from style entries.
// ============================================================================

message NodeComponent {
  // Required. Element style entries reference this via their `component` field.
  string name = 1;

  // The styling — same Glyph types used in style entries.
  optional archeglyph.style.v1.Glyph2D shape = 2;
  optional archeglyph.style.v1.Typography typography = 3;
}

message EdgeComponent {
  string name = 1;
  optional archeglyph.style.v1.Glyph1D connection = 2;
  optional archeglyph.style.v1.Typography typography = 3;
}

message AnnotationComponent {
  string name = 1;
  optional archeglyph.style.v1.Glyph2D shape = 2;
  optional archeglyph.style.v1.Typography typography = 3;
  optional archeglyph.style.v1.Glyph1D callout = 4;
}

message Tokens {
  // Field 1 was `colors`, field 4 was `spacings`; both are reused below
  // rather than reserved. This is a BREAKING change and deliberately not a
  // backward-compatible one: pre-1.0, there is no released file format to
  // stay compatible with, and a reserved number is a permanent scar carried
  // for readers that do not exist.
  //
  // `colors` was one flat map serving two incompatible goals: naming by
  // colour is DRY but documents nothing about what is stylable, naming by
  // slot enumerates the surface but duplicates a hex two slots share.
  // `spacings` had no consumer at all — layout reads canvas.node_spacing
  // from the STYLESHEET.

  // Raw colours. Literal hex/rgb ONLY — a palette entry may never itself be
  // a reference, which is what makes role resolution one hop by construction
  // rather than by cycle detection.
  //
  // Referenced only from `roles`, as "$palette.<name>". A component or a
  // stylesheet reaching past roles into the palette would make the role
  // enumeration decorative, so it is forbidden, and it is greppable.
  map<string, string> palette = 1;

  // Named styling slots — the layer between a raw colour and a component.
  // A value is either a literal or "$palette.<name>": one hop, no chains.
  //
  // Components and stylesheets reference these as "$roles.<name>". Roles are
  // meant to be EXHAUSTIVE over the slots the component messages can reach,
  // including ones a given theme's own components do not fill: a role that
  // nothing references still tells an author the knob exists, and costs no
  // duplicated value, since several roles may point at one palette entry.
  //
  // `background` is reserved: the cascade looks it up for the canvas. It is
  // the one role that may be absent without error, because there the ENGINE
  // does the lookup rather than the author — a reference someone typed is a
  // mistake when it dangles, a lookup made on their behalf is not. Omit it
  // and the diagram renders transparent, which adapts to whatever the SVG is
  // embedded in.
  map<string, string> roles = 4;

  // Typography tokens. Referenced as "$fonts.<name>".
  map<string, FontSpec> fonts = 2;

  // Numeric sizes (for stroke widths, glow radii, font sizes, etc).
  // Referenced as "$sizes.<name>".
  map<string, double> sizes = 3;

  // Stroke dash patterns ("5,5", "2,2,5,5", etc).
  // Referenced as "$dashes.<name>".
  map<string, string> dashes = 5;

  // Custom SVG path data for Glyph2D.shape_kind.custom_path_ref.
  // Referenced as "$shape_paths.<name>".
  map<string, string> shape_paths = 6;
}

message FontSpec {
  string family = 1;
  optional double size = 2;
  optional archeglyph.style.v1.FontWeight weight = 3;
}
